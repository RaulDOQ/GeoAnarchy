    wrong: "Código errado ou vencido. No jogo, digite `/vincular` para receber um código novo."
    locked: "Muitos códigos errados. Espere {minutes} minuto(s) e tente de novo."
    none: "Seu Discord não está vinculado a nenhuma conta."
    removed: "O vínculo com **{player}** foi desfeito."

  # ---- Consultas ----
  saldo:
