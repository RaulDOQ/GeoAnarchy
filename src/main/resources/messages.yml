    done: "✅ Enviado: **{amount}** para **{player}**.\nSua carteira agora tem {balance}."
    # O dinheiro foi enviado, mas o registro (limite do dia e aviso no jogo) falhou. O plugin refaz o registro sozinho.
    not-recorded: "✅ Enviado: **{amount}** para **{player}**.\nO registro do envio ainda não foi salvo; o servidor termina isso sozinho. Não envie de novo."
    receiver-full: "**{player}** não pode guardar tanto dinheiro."
  # O que aparece no jogo, no próximo login, depois de "Pelo Discord, a sua conta:"
  log:
    deposit: "depositou {amount} no banco de {country}"
    pay: "pagou {amount} para {player}"

  # ---- /notificacoes ----
  notify:
    title: "🔔 Seus avisos"
    intro: "Os avisos chegam por mensagem privada do bot. Aperte um botão para ligar ou desligar."
    footer: "Botão verde = ligado · Botão cinza = desligado"
