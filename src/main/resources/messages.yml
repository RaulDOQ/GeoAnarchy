# Textos do GeoAnarchy
# Recarregue com /geoanarchy reload.
#
# "game" são os textos que aparecem no Minecraft. A formatação é MiniMessage
# (https://docs.advntr.dev/minimessage/format.html) e os valores entram como <nome>.
#
# "discord" são os textos que aparecem no Discord. Use a formatação do próprio Discord
# (**negrito**, `código`) e os valores entram como {nome}.
#
# Não mude os nomes entre < > e { }: é por eles que o plugin coloca o jogador, o país, o valor.
# Um texto que faltar aqui usa o que vem dentro do plugin.

game:
  prefix: "<dark_gray>[<green>GeoAnarchy</green>]</dark_gray> "
  players-only: "<prefix><red>Só jogadores podem usar este comando.</red>"
  no-permission: "<prefix><red>Você não tem permissão para fazer isso.</red>"

  # ---- Vincular ----
  link-code: "<prefix><gray>Seu código: <white><bold><code></bold></white> <dark_gray>(clique para copiar)</dark_gray><newline><gray>No Discord, clique em <white>Vincular conta</white> ou use <white>/vincular</white> e digite o código. Ele vale por <minutes> minutos."
  link-already: "<prefix><gray>Sua conta já está vinculada ao Discord. Para desfazer: <white>/desvincular</white>"
  link-done: "<prefix><green>Conta vinculada ao Discord de <white><discord></white>.</green><newline><gray>Os avisos do seu país chegam por mensagem privada. Escolha quais com <white>/notificacoes</white> no Discord."
  link-bot-off: "<prefix><yellow>O bot do Discord está desligado agora. Guarde o código e tente em alguns minutos, ou peça um novo depois."
  link-tip: "<prefix><gray>Você fundou um país. Vincule o seu Discord com <white>/vincular</white> para ser avisado quando ele for atacado."
  unlink-done: "<prefix><gray>O vínculo com o Discord foi desfeito."
  unlink-none: "<prefix><gray>Sua conta não está vinculada ao Discord."
  dm-closed: "<prefix><yellow>O bot não conseguiu te enviar mensagem privada no Discord. Abra as mensagens privadas do nosso servidor para receber os avisos."

  # ---- /discord e /mapa ----
  discord-invite: "<prefix><gray>Entre no nosso Discord: <white><underlined><url></underlined></white>"
  map: "<prefix><gray>Mapa ao vivo: <white><underlined><url></underlined></white>"
  discord-usage: "<prefix><gray>Uso: /discord, /discord vincular, /discord desvincular, /discord acoes <on|off>"
  actions-on: "<prefix><green>Depósitos e pagamentos pelo Discord estão ligados para a sua conta."
  actions-off: "<prefix><green>Depósitos e pagamentos pelo Discord estão desligados para a sua conta.</green> <gray>Ninguém consegue mexer no seu dinheiro pelo Discord."
  actions-are-on: "<prefix><gray>Depósitos e pagamentos pelo Discord estão <green>ligados</green> para a sua conta. Para desligar: <white>/discord acoes off</white>"
  actions-are-off: "<prefix><gray>Depósitos e pagamentos pelo Discord estão <red>desligados</red> para a sua conta. Para ligar: <white>/discord acoes on</white>"

  # ---- O que foi feito pelo Discord ----
  login-log-header: "<prefix><gray>Pelo Discord, desde a sua última visita, a sua conta:"
  login-log-line: "<dark_gray> -</dark_gray> <white><text></white>"
  pay-received: "<prefix><gray>Você recebeu <gold><amount></gold> de <white><player></white> <dark_gray>(enviado pelo Discord)</dark_gray>."

  # ---- /ranks ----
  ranks-header-time: "<prefix><gold>Quem mais jogou</gold>"
  ranks-header-kills: "<prefix><gold>Quem mais matou jogadores</gold>"
  ranks-line: "<gray><rank>.</gray> <white><player></white> <dark_gray>-</dark_gray> <gold><value></gold>"
  ranks-empty: "<dark_gray> -</dark_gray> <gray>Ninguém ainda."
  ranks-loading: "<prefix><gray>Os ranks ainda estão sendo calculados (<percent>%). A lista abaixo pode estar incompleta."

  # ---- VIP ----
  vip-usage: "<prefix><gray>Uso: /darvip <jogador> <plano> <meses>. Planos: <white><plans></white>"
  vip-unknown-plan: "<prefix><red>Plano desconhecido: <white><plan></white>. Os planos são: <white><plans></white>.</red>"
  vip-no-luckperms: "<prefix><red>O LuckPerms não está no servidor, e é ele que guarda os planos.</red>"
  vip-bad-months: "<prefix><red>Os meses precisam ser um número de 1 a 120.</red>"
  vip-unknown-player: "<prefix><red><white><player></white> nunca entrou no servidor.</red>"
  vip-given: "<prefix><green><white><player></white> recebeu <months> mês(es) de <white><plan></white> (<days> dias, somados ao que já tinha).</green>"
  vip-received: "<prefix><gold>Você recebeu <white><days></white> dias de <white><plan></white>! Abra o menu com <white>/geomenu</white>.</gold>"

  # ---- Administração ----
  admin-usage: "<prefix><gray>Uso: /geoanarchy reload, /geoanarchy status ou /geoanarchy cafe <jogador> <qualidade>"

  # ---- Café (bebida do BreweryX) ----
  coffee-usage: "<prefix><gray>Uso: /geoanarchy cafe <jogador online> <qualidade de 1 a 10>. O BreweryX usa isso quando alguém bebe café."
  coffee-drunk: "<prefix><gold>O café bateu!</gold> <gray>Mais rapidez e menos fome por <white><time></white>.</gray>"
  reloaded: "<prefix><green>config.yml e messages.yml recarregados.</green> <gray>Trocar o token ou os canais do Discord pede um restart."
  status: "<prefix><gold>GeoAnarchy</gold><newline><gray>Bot do Discord: <white><bot></white><newline>Contas vinculadas: <white><links></white><newline>Lands: <white><lands></white><newline>GeoEconomy: <white><economy></white>"

  # ---- Primeira entrada: onde começar ----
  start-title: "Onde você quer começar?"
  # As duas linhas embaixo do mapa (curtas: cabem ao lado do dado).
  start-line-1: "Escolha um continente."
  start-line-2: "Longe dos países, em paz."
  start-lore-players: "<gray>Jogadores aqui agora: <white><players></white>"
  start-lore-click: "<yellow>Clique para começar aqui."
  start-random: "<white>Aleatório"
  start-random-lore: "<gray>Um continente qualquer."
  start-searching: "<prefix><gray>Procurando um lugar seguro em <white><continent></white>..."
  start-failed: "<prefix><red>Não achei um lugar seguro agora.</red> <gray>Tente de novo com <white>/comecar</white>."
  start-busy: "<prefix><gray>Calma, ainda procurando o lugar..."
  start-landed: "<prefix><gray>Você chegou: <white><continent></white>. Se morrer, você renasce aqui (até dormir numa cama). O <white>Guia do GeoAnarchy</white> está no seu inventário, e <white>/guia</white> abre ele quando quiser."
  start-title-sub: "<gray>Boa sorte, <white><player></white>!"
  start-closed: "<prefix><gray>Você ainda não escolheu onde começar. Use <white>/comecar</white> quando quiser (só nos seus primeiros <minutes> minutos)."
  start-already: "<prefix><gray>Você já escolheu onde começar."
  start-too-late: "<prefix><gray>A escolha de onde começar é só para quem acabou de chegar."
  start-reset: "<prefix><gray>A escolha de <white><player></white> foi zerada. O menu aparece de novo com <white>/comecar</white>."
  start-not-online: "<prefix><red><player> não está online."

  # ---- O livro "Guia do GeoAnarchy" (uma página por linha; aparecem na ordem dos números) ----
  guide-title: "Guia do GeoAnarchy"
  guide-author: "GeoAnarchy"
  guide-page-1: "<bold><dark_green>GEO</dark_green><dark_aqua>ANARCHY</dark_aqua></bold><newline><newline>O mundo é a Terra, em escala.<newline><newline>Aqui vale tudo: <bold>fora dos países nada é protegido</bold>.<newline><newline><dark_gray>Vire a página para os primeiros passos."
  guide-page-2: "<bold>Primeiros passos</bold><newline><newline>No painel da direita estão os seus primeiros passos. Cada um vale Geos: veja todos com <dark_aqua>/passos</dark_aqua>.<newline><newline>Nos seus primeiros 20 minutos de jogo nenhum jogador pode te machucar: <dark_aqua>/protecao</dark_aqua>."
  guide-page-3: "<bold>Países</bold><newline><newline>Um país protege as suas terras e tem banco e moeda própria.<newline><newline>Veja quem procura gente com <dark_aqua>/recrutando</dark_aqua> e peça para entrar, ou funde o seu.<newline><newline>Um país pode declarar guerra a outro a qualquer hora."
  guide-page-4: "<bold>Sem teleporte</bold><newline><newline>Não existe /tpa nem /home: aqui você anda, navega ou cavalga.<newline><newline>O Nether e o End estão fechados por enquanto."
  guide-page-5: "<bold>Dinheiro</bold><newline><newline>Num mercado, venda o que tiver com <dark_aqua>/vender</dark_aqua>. Os mercados aparecem no mapa.<newline><newline>Veja quanto cada coisa vale com <dark_aqua>/mercado lista</dark_aqua>.<newline><newline>A economia é dos jogadores: não há loja do servidor."
  guide-page-6: "<bold>Discord</bold><newline><newline>Vincule a sua conta com <dark_aqua>/vincular</dark_aqua> e receba os avisos do seu país.<newline><newline><click:open_url:'https://discord.gg/nXdhtMD8Cx'><blue><underlined>discord.gg/nXdhtMD8Cx</underlined></blue></click>"
  guide-page-7: "<bold>Mais</bold><newline><newline><dark_aqua>/geomenu</dark_aqua>: tags, skins e mais.<newline><newline>A wiki explica tudo:<newline><click:open_url:'https://geoanarchy.net/wiki'><blue><underlined>geoanarchy.net/wiki</underlined></blue></click><newline><newline>Mapa ao vivo:<newline><click:open_url:'https://mapa.geoanarchy.net'><blue><underlined>mapa.geoanarchy.net</underlined></blue></click>"

  # ---- Quem acabou de chegar: proteção contra jogadores ----
  protection-start: "<prefix><gray>Por <white><minutes> minutos</white> de jogo nenhum jogador pode te machucar, e você também não pode atacar jogadores. Veja quanto falta com <white>/protecao</white>."
  protection-warning: "<prefix><yellow>Sua proteção contra jogadores acaba em <time>.</yellow>"
  protection-ended: "<prefix><gold>Sua proteção acabou.</gold> <gray>Agora qualquer jogador pode te atacar, e você pode lutar."
  protection-ended-country: "<prefix><gray>Você entrou num país, então a sua proteção de novato acabou."
  protection-turned-off: "<prefix><gray>Você desligou a sua proteção. Agora você pode lutar, e qualquer jogador pode te atacar."
  protection-confirm: "<prefix><gray>Desligar a proteção não tem volta. Para confirmar: <white>/protecao desligar confirmar</white>"
  protection-left: "<prefix><gray>Sua proteção contra jogadores: falta <white><time></white> de jogo (só conta enquanto você está online). <white>/protecao desligar</white> acaba com ela antes."
  protection-none: "<prefix><gray>Você não tem proteção de novato."
  # Na barra de ação de quem tenta atacar.
  protection-target: "<gray><white><player></white> acabou de chegar: protegido por mais <white><time></white>."
  protection-self: "<gray>Você ainda está protegido e não pode atacar jogadores. Veja <white>/protecao</white>."

  # ---- Primeiros passos (os Geos de cada um ficam no config.yml) ----
  steps-intro: "<prefix><gray>Seus <white>Primeiros passos</white> estão no painel da direita: cada um vale Geos, até <white><geos> Geos</white> no total. Veja todos com <white>/passos</white>."
  step-done: "<prefix><green>Passo feito: <white><step></white>!</green> <gray>+<white><geos> Geos</white>"
  steps-all-done: "<prefix><gold>Todos os primeiros passos feitos!</gold> <gray>Você ganhou <white><geos> Geos</white>. Boa sorte na Terra."
  steps-not-new: "<prefix><gray>Os primeiros passos são para quem acabou de chegar."
  steps-hidden: "<prefix><gray>Os passos saíram do painel. <white>/passos mostrar</white> traz de volta."
  steps-shown: "<prefix><gray>Os passos voltaram para o painel."
  steps-title: "Primeiros passos <done>/<total>"
  steps-name-done: "<green>✔ <step>"
  steps-name-todo: "<white><step>"
  steps-lore-reward: "<gray>Recompensa: <gold><geos> Geos"
  steps-lore-done: "<green>Feito!"
  steps-lore-todo: "<yellow>Ainda falta."
  steps-toggle-hide: "<white>Tirar do painel"
  steps-toggle-show: "<white>Mostrar no painel"
  steps-toggle-lore: "<gray>O painel da direita mostra os passos que faltam."
  # No painel da direita (sem cores: o GeoRoster pinta).
  side-protection: "Proteção"
  side-steps: "Primeiros passos"
  side-reward: "Valem até <geos> Geos"
  step-guia-name: "Abrir o guia"
  step-guia-how: "<gray>Use <white>/guia</white> ou abra o livro Guia do GeoAnarchy."
  step-cama-name: "Dormir numa cama"
  step-cama-how: "<gray>Faça uma cama (3 lãs e 3 tábuas) e deite nela. Você passa a renascer ali."
  step-noite-name: "Passar uma noite"
  step-noite-how: "<gray>Fique online uma noite inteira sem morrer. Dormir também vale."
  step-recrutando-name: "Ver países recrutando"
  step-recrutando-how: "<gray>Use <white>/recrutando</white> e veja quem procura gente."
  step-mercado-name: "Vender num mercado"
  step-mercado-how: "<gray>Num mercado, venda qualquer coisa com <white>/vender</white>. Os mercados aparecem no mapa."
  step-pais-name: "Entrar num país"
  step-pais-how: "<gray>Peça para entrar num país e aceite o convite do líder."

  # ---- Dicas (cada uma aparece uma vez, na hora certa) ----
  tip-noite: "<prefix><aqua>Dica:</aqua> <gray>a noite chegou e os monstros aparecem no escuro. Uma cama pula a noite e vira o lugar onde você renasce."
  tip-morte: "<prefix><aqua>Dica:</aqua> <gray>seus itens ficaram num túmulo onde você morreu, por 2 dias. Volte rápido: qualquer jogador pode abrir."
  tip-pais: "<prefix><aqua>Dica:</aqua> <gray>você entrou em <white><country></white>. Aqui você não pode quebrar nem abrir nada, e dentro dos países o PvP sempre vale."
  tip-teleporte: "<prefix><aqua>Dica:</aqua> <gray>aqui não existe teleporte. Tudo é a pé, a cavalo ou de barco: o mundo é a Terra, então planeje a viagem."
  tip-minerio: "<prefix><aqua>Dica:</aqua> <gray>minérios valem Geos nos mercados. Veja onde eles ficam no mapa: <click:open_url:'https://mapa.geoanarchy.net'><white><underlined>mapa.geoanarchy.net</underlined></white></click>"
  tip-chat: "<prefix><aqua>Dica:</aqua> <gray>no chat Global todos te veem. <white>/l</white> fala só com quem está a até 230 blocos, e <white>/g</white> volta para o Global."
  tip-recrutar: "<prefix><aqua>Dica:</aqua> <gray>sozinho é difícil. Veja os países que procuram gente com <white>/recrutando</white>."
  tips-off: "<prefix><gray>Dicas desligadas. <white>/dicas</white> liga de novo."
  tips-on: "<prefix><gray>Dicas ligadas."
  tips-not-new: "<prefix><gray>As dicas são para quem acabou de chegar."

  # ---- Países recrutando (/recrutar e /recrutando) ----
  start-lore-countries: "<gray>Países aqui: <white><countries></white> <dark_gray>·</dark_gray> <gray>recrutando: <white><recruiting></white>"
  recruit-title: "Países recrutando"
  recruit-empty: "<white>Nenhum país recrutando agora"
  recruit-empty-lore: "<gray>Os líderes entram na lista com <white>/recrutar ligar</white>."
  recruit-item-name: "<green><country>"
  recruit-lore-level: "<gray>Nível: <white><level>"
  recruit-lore-citizens: "<gray>Cidadãos: <white><citizens>"
  recruit-lore-continent: "<gray>Continente: <white><continent>"
  recruit-lore-leaders: "<gray>Líderes online agora: <white><online>"
  recruit-lore-message: "<white><message>"
  recruit-lore-click: "<yellow>Clique para pedir para entrar."
  recruit-lore-member: "<green>Você já é deste país."
  recruit-request: "<prefix><white><player></white> <gray>quer entrar em <white><country></white> (está em <continent>)."
  recruit-new-player: "<prefix><gray>Jogador novo: <white><player></white> acabou de chegar em <white><continent></white>."
  recruit-somewhere: "algum lugar"
  recruit-sent: "<prefix><gray>Pedido enviado para <white><country></white>: <white><online></white> líder(es) online viram. Eles podem te responder ou mandar um convite."
  recruit-sent-offline: "<prefix><gray>Pedido guardado para <white><country></white>. Nenhum líder está online agora: eles veem quando entrarem (o pedido vale <days> dias)."
  recruit-wait: "<prefix><gray>Você já pediu para entrar em <white><country></white> há pouco. Dá para pedir de novo depois de <hours> horas."
  recruit-member: "<prefix><gray>Você já é de <white><country></white>."
  recruit-gone: "<prefix><red>Esse país não existe mais."
  recruit-not-leader: "<prefix><gray>Só o fundador ou um Admin de um país pode usar <white>/recrutar</white>. Para procurar um país: <white>/recrutando</white>."
  recruit-default-message: "Procuramos novos cidadãos!"
  recruit-on: "<prefix><green><country> está na lista de países recrutando.</green> <gray>Mensagem: <white><message></white>"
  recruit-off: "<prefix><gray><white><country></white> saiu da lista de países recrutando."
  recruit-status-on: "<prefix><gray><white><country></white> está recrutando. Mensagem: <white><message></white>"
  recruit-status-off: "<prefix><gray><white><country></white> não está na lista de países recrutando."
  recruit-usage: "<gray>/recrutar ligar <mensagem> <dark_gray>·</dark_gray> <gray>/recrutar desligar <dark_gray>·</dark_gray> <gray>/recrutar pedidos <dark_gray>·</dark_gray> <gray>/recrutar avisos"
  recruit-alerts-on: "<prefix><gray>Você volta a receber os avisos de jogadores novos."
  recruit-alerts-off: "<prefix><gray>Avisos de jogadores novos desligados. <white>/recrutar avisos</white> liga de novo."
  recruit-pending-head: "<prefix><gray>Pedidos para entrar em <white><country></white> (<count>):"
  recruit-pending-line: "<dark_gray> • </dark_gray><white><player></white> <gray>(<when>)"
  recruit-no-requests: "<prefix><gray>Nenhum pedido para entrar agora."
  recruit-dismissed: "<prefix><gray>Pedido de <white><player></white> dispensado."
  recruit-no-such-request: "<prefix><gray><white><player></white> não tem pedido para os seus países."
  button-reply: "<aqua>[Responder]"
  button-reply-hover: "<gray>Escrever para <white><player></white>"
  button-invite: "<green>[Convidar]"
  button-invite-hover: "<gray>Preparar o convite do Lands para <white><player></white> (você só aperta Enter)"
  button-dismiss: "<dark_gray>[Dispensar]"
  button-dismiss-hover: "<gray>Tirar o pedido de <white><player></white> da lista"
  ago-now: "agora"
  ago-minutes: "há <n> min"
  ago-hours: "há <n> h"
  ago-days: "há <n> dias"

discord:
  error: "Algo deu errado. Tente de novo em instantes."
  economy-off: "A economia do servidor não está disponível agora."
  countries-off: "Os países não estão disponíveis agora."

  status:
    online: "🟢 Servidor ligado · Minecraft {version} · {players} jogador(es) online"

  # ---- Vincular ----
  link:
    needed: "Seu Discord ainda não está vinculado a uma conta do Minecraft.\nEntre no servidor, digite `/vincular` e depois use `/vincular` aqui com o código."
    window-title: "Vincular conta"
    window-label: "Código que o jogo mostrou com /vincular"
