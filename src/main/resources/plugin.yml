name: GeoAnarchy
version: '${project.version}'
main: me.rauldoq.geoAnarchy.GeoAnarchy
api-version: '1.21'
author: RaulDOQ
description: Discord, alertas e utilidades do servidor GeoAnarchy.
# None of these is required. Each part of the plugin switches itself on when its plugin is present.
softdepend: [Vault, Lands, GeoEconomy, LuckPerms, Essentials, PlaceholderAPI]

commands:
  vincular:
    description: Vincula a sua conta do Minecraft ao seu Discord.
    usage: /<command>
  desvincular:
    description: Desfaz o vínculo com o Discord.
    usage: /<command>
  discord:
    description: Convite do Discord e opções da sua conta vinculada.
    usage: /<command> [vincular|desvincular|acoes <on|off>]
  mapa:
    description: Mostra o link do mapa ao vivo.
    usage: /<command>
  ranks:
    description: Mostra quem mais jogou e quem mais matou.
    usage: /<command>
  darvip:
    description: Dá meses de um plano VIP (Geo+, Geo Ultra, Geo Ultra+) a um jogador.
    usage: /<command> <jogador> <plano> <meses>
    permission: geoanarchy.darvip
  vanishcomaura:
    description: Some com estilo.
    usage: /<command>
    aliases: [vaura]
    permission: geoanarchy.vanishcomaura
  comecar:
    description: Escolhe o continente onde você começa (só para quem acabou de chegar).
    usage: /<command>
  guia:
    description: Abre o Guia do GeoAnarchy.
    usage: /<command>
  passos:
    description: Os seus primeiros passos no servidor, cada um vale Geos.
    usage: /<command> [esconder|mostrar]
  dicas:
    description: Liga ou desliga as dicas para quem acabou de chegar.
    usage: /<command>
  protecao:
    description: Quanto falta da sua proteção de novato contra jogadores.
    usage: /<command> [desligar]
  recrutar:
    description: Põe o seu país na lista de países recrutando (fundador ou Admin).
    usage: /<command> [ligar <mensagem>|desligar|avisos|pedidos|dispensar <jogador>]
  recrutando:
    description: Os países que procuram gente, para pedir para entrar.
    usage: /<command>
  geoanarchy:
    description: Administração do plugin GeoAnarchy.
    usage: /<command> <reload|status|cafe>
    permission: geoanarchy.admin

permissions:
  geoanarchy.darvip:
    description: Dar VIP a jogadores.
    default: op
  geoanarchy.vanishcomaura:
    description: Usar /vanishcomaura.
    default: op
  geoanarchy.admin:
    description: Recarregar o plugin e ver o estado do bot.
    default: op
  geoanarchy.comecar.admin:
    description: "Zerar a escolha de continente de um jogador (/comecar reiniciar <jogador>), para testar."
    default: op
