# GeoAnarchy
# Recarregue com /geoanarchy reload. Trocar o token ou os canais do Discord pede um restart.
# Os textos ficam em messages.yml.

discord:
  # O token do bot (Discord Developer Portal > Bot > Token).
  # NUNCA mostre este arquivo a ninguém nem o coloque no GitHub: quem tem o token controla o bot.
  # Vazio = o plugin funciona sem o Discord.
  token: ""
  # O id do seu servidor do Discord. 0 = o primeiro servidor em que o bot estiver.
  guild-id: 0
  # O que aparece como "Jogando ..." no perfil do bot.
  activity: "GeoAnarchy.net"
  channels:
    # Canal público onde as declarações de guerra são anunciadas. 0 = não anunciar.
    war: 1333077790072901653
    # Canal onde o bot avisa que o servidor ligou. 0 = não avisar.
    status: 1254199563888099448

links:
  invite: "https://discord.gg/nXdhtMD8Cx"
  map: "https://mapa.geoanarchy.net/"
  site: "https://geoanarchy.net"

# Vincular a conta do Minecraft com a do Discord.
linking:
  # Por quantos minutos o código do /vincular vale.
  code-minutes: 10
  # Quantos códigos errados uma conta do Discord pode digitar antes de ter que esperar.
  max-attempts: 5
  lock-minutes: 5
  # Cargo dado no Discord a quem vinculou. "" = nenhum.
  role: "Vinculado"
  # Trocar o apelido no Discord pelo nome do Minecraft.
  sync-nickname: true

# Avisos por mensagem privada no Discord.
alerts:
  # Quantos minutos depois da declaração a guerra começa. Tem que ser igual ao
  # "preparation_time" de plugins/Lands/Modules/Wars/wars.yml (hoje: 1h).
  war-preparation-minutes: 60
  # No máximo um aviso de bandeira capturada por país a cada tantos minutos.
  flag-cooldown-minutes: 5
  # No máximo um aviso de "falta dinheiro para a manutenção" por país a cada tantas horas.
  upkeep-cooldown-hours: 12

# Coisas que mexem em dinheiro pelo Discord: /depositar e /pagar.
actions:
  enabled: true
  # O máximo de Geos que um jogador pode enviar com /pagar pelo Discord por dia.
  pay-daily-limit: 10000
  # Quantos segundos o botão Confirmar fica valendo.
  confirm-seconds: 60

ranks:
  # De quantos em quantos minutos o tempo de jogo de quem está online é lido de novo para o /ranks.
  # As kills contam na hora. Quem está offline é lido uma vez, aos poucos, quando o servidor liga.
  refresh-minutes: 5

vip:
  # Os planos que o /darvip dá: /darvip <jogador> <plano> <meses>.
  # Cada plano é um grupo do LuckPerms, o mesmo que o plugin GeoUltra procura.
  # O tempo fica com o LuckPerms (grupo temporário): o /darvip soma dias ao que o jogador já tem,
  # e o LuckPerms tira o grupo quando os dias acabam.
  plans:
    geoplus:
      name: "Geo+"
      group: geoplus
    ultra:
      name: "Geo Ultra"
      group: ultra
    ultraplus:
      name: "Geo Ultra+"
      group: ultraplus
  # Quantos dias vale um mês.
  days-per-month: 30

coffee:
  # Café do BreweryX: Pressa (Haste) e a fome caindo mais devagar, pelo mesmo tempo.
  # O BreweryX roda "/geoanarchy cafe <jogador> <qualidade>" quando alguém bebe café.
  # Quanto melhor o café, mais tempo dura (cresce com o quadrado da qualidade):
  # qualidade 1 = worst-seconds, 5 = uns 4 minutos, 8 = uns 12 minutos, 10 = best-seconds.
  worst-seconds: 15
  best-seconds: 1200
  # Quão rápido a fome cai enquanto dura: 0.5 = metade da velocidade normal.
  hunger-multiplier: 0.5

# A primeira entrada de um jogador: logo depois do login, ele escolhe o continente onde começa, chega num
# lugar seguro de lá e ganha o livro "Guia do GeoAnarchy". É o único teleporte do servidor, uma vez só.
onboarding:
  enabled: true
  # O mundo da Terra.
  world: earth
  # A escolha só aparece (e o /comecar só funciona) nestes primeiros minutos de jogo, e só até ser feita.
  first-minutes: 30
  # O lugar de chegada fica pelo menos a esta distância (em chunks) de qualquer país.
  distance-from-countries-chunks: 8
  # Quantos lugares tentar antes de desistir (água, país perto...).
  tries: 40
  # Segundos de proteção (Resistência V) logo depois de chegar, para um creeper ou uma queda não matar na hora.
  protection-seconds: 15
  guide-book: true

# Quem chegou pelo seletor de continente: primeiros passos, proteção e dicas.
newcomers:
  # Minutos de proteção contra outros jogadores depois de chegar (só contam enquanto o jogador está online).
  # Ninguém pode machucar o novato, e ele também não pode atacar jogadores. Acaba antes se ele entrar num país.
  protection-minutes: 20
  # Geos de cada primeiro passo (1.000 no total). 0 = o passo não paga nada.
  steps:
    guia: 50
    cama: 150
    noite: 150
    recrutando: 50
    mercado: 200
    pais: 400
  # Depois de tantas horas de jogo os passos saem do painel da direita (o /passos continua funcionando).
  steps-sidebar-hours: 5
  # Segundos entre uma dica e a próxima.
  tip-gap-seconds: 90

# /recrutar e /recrutando: países procurando gente. Nada é automático: o líder responde e convida pelo Lands.
recruiting:
  # Além do fundador, quem tem estes cargos do Lands conta como líder (pode usar /recrutar e recebe os pedidos).
  leader-roles:
    - Admin
  # Por quantos dias um pedido para entrar fica guardado.
  request-days: 3
  # Um jogador pode pedir para entrar no mesmo país uma vez a cada tantas horas.
  request-cooldown-hours: 24
  # Tamanho máximo da mensagem do /recrutar ligar.
  message-max: 80
